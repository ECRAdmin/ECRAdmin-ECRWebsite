version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js (App Router)
  - React
  - Tailwind CSS
  - Lucide React
  - GSAP
  - Sanity CMS
  - NextAuth.js
routes:
  - path: /[locale]
    file: src/app/[locale]/page.tsx
    auth_required: false
    description: Homepage with hero scene and featured cars
  - path: /[locale]/about
    file: src/app/[locale]/about/page.tsx
    auth_required: false
    description: About Us page
  - path: /[locale]/fleet
    file: src/app/[locale]/fleet/page.tsx
    auth_required: false
    description: Car fleet explorer page
  - path: /[locale]/fleet/[slug]
    file: src/app/[locale]/fleet/[slug]/page.tsx
    auth_required: false
    description: Individual car detail page
  - path: /[locale]/contact
    file: src/app/[locale]/contact/page.tsx
    auth_required: false
    description: Contact page with inquiry form
  - path: /[locale]/login
    file: src/app/[locale]/login/page.tsx
    auth_required: false
    description: User login page
  - path: /[locale]/dashboard
    file: src/app/[locale]/dashboard/page.tsx
    auth_required: true
    description: User dashboard for managing bookings
  - path: /[locale]/faq
    file: src/app/[locale]/faq/page.tsx
    auth_required: false
    description: Frequently Asked Questions
  - path: /[locale]/offers
    file: src/app/[locale]/offers/page.tsx
    auth_required: false
    description: Special offers and promotions
features:
  - name: Car Booking
    description: Users can book a vehicle by filling out a booking form
    files:
      - src/components/site/booking-form.tsx
      - src/app/api/bookings/route.ts
      - src/lib/booking-store.ts
    entry_route: /[locale]/fleet/[slug]
    user_interactions:
      - Navigate to a car detail page
      - Fill in pickup and dropoff dates
      - Select locations
      - Click 'Book Now'
    api_calls:
      - method: POST
        endpoint: /api/bookings
    auth_required: false
  - name: Inquiry Submission
    description: Users can send general inquiries via a contact form
    files:
      - src/components/site/inquiry-form.tsx
      - src/app/api/inquiries/route.ts
    entry_route: /[locale]/contact
    user_interactions:
      - Fill in name, email, and message
      - Click 'Submit'
    api_calls:
      - method: POST
        endpoint: /api/inquiries
    auth_required: false
  - name: Fleet Explorer
    description: Users can browse and filter available vehicles
    files:
      - src/components/site/fleet-explorer.tsx
      - src/app/api/public/fleet/route.ts
    entry_route: /[locale]/fleet
    user_interactions:
      - Scroll through car list
      - Use filters (if any) to narrow down choices
    api_calls:
      - method: GET
        endpoint: /api/public/fleet
    auth_required: false
known_limitations: []
